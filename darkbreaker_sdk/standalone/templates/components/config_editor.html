<!-- Configuration Editor -->
<div class="card bg-dark border-secondary">
    <div class="card-header border-secondary d-flex justify-content-between align-items-center">
        <span><i class="bi bi-gear me-2"></i>Configuration</span>
        <button class="btn btn-outline-secondary btn-sm" id="btn-reload-config" title="Reload config">
            <i class="bi bi-arrow-clockwise"></i>
        </button>
    </div>
    <div class="card-body">
        <div id="config-form">
            <div class="text-secondary small text-center py-2">Loading configuration...</div>
        </div>
        <div class="d-grid mt-3">
            <button class="btn btn-outline-primary btn-sm" id="btn-save-config" disabled>
                <i class="bi bi-save me-1"></i>Save Configuration
            </button>
        </div>
    </div>
</div>
