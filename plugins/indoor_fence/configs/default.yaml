# =============================================================================
# 室内电子围栏插件 - 默认配置 (2.1)
# =============================================================================

# 区域配置文件
zone_config:
  path: "standalone/configs/zone.yaml"
  persist_on_update: true

# 模型配置
model:
  path: "models/indoor/person_yolov8n.onnx"
  device: "cpu"
  input_size: [640, 640]

# 推理配置
inference:
  confidence_threshold: 0.5
  nms_threshold: 0.45
  tracking_enabled: true
  max_track_age: 30

# 跟踪配置
tracking:
  enabled: true
  max_age: 30
  min_hits: 3
  distance_threshold: 1.0
  use_kalman: true

# 激光雷达配置
lidar:
  enabled: true
  device_ip: "192.168.1.100"
  device_port: 2368
  scan_rate_hz: 10
  angle_min_deg: -45
  angle_max_deg: 45
  angle_offset_deg: 0.0
  install:
    height_m: 2.5
    tilt_deg: 20
    scan_plane_height_m: 0.5

# 相机配置
camera:
  enabled: true
  source: "0"
  resolution: [640, 480]
  fps: 30
  confidence_threshold: 0.5
  nms_threshold: 0.45
  model_path: "models/indoor/person_yolov8n.onnx"
  cx: 320
  cy: 240
  fx: 500
  fy: 500
  height_m: 3.0
  tilt_deg: 40

# 视觉-雷达融合配置
fusion:
  enabled: true
  max_time_diff_ms: 100
  angle_match_threshold_deg: 5.0
  distance_match_threshold_m: 0.5

# 安全区域配置
safety_zone:
  yellow_line_distance_m: 0.5
  warning_distance_m: 0.3
  danger_distance_m: 0.1
  yellow_line_position_m: 2.0

# 授权与同柜多人策略
cabinet_authorization:
  enabled: true
  allow_list: [3, 4, 5]
  check_multi_person: true
  max_persons_per_cabinet: 1

# 灯光输出
light:
  enabled: true
  output_type: "simulate"

# 审计日志
audit:
  enabled: true
  log_level: "event"
  log_dir: "logs/indoor_fence"

# =============================================================================
# V3.0 Extensions
# =============================================================================

# UWB定位配置
uwb:
  enabled: false
  protocol: "simulate"
  host: "192.168.1.200"
  port: 5000
  simulate_nlos: true
  nlos_ratio: 0.2
  noise_sigma_los: 0.1
  noise_sigma_nlos: 0.5

# IMU惯性传感器配置
imu:
  enabled: false
  device_id: "imu_0"
  sample_rate_hz: 100

# 检测模块配置
detection:
  pose_enabled: true
  behavior_enabled: true
  auto_fence_enabled: false
  pose_model_path: null
  behavior_window_size: 30
  prolonged_stay_threshold_s: 30.0

# 融合算法配置
fusion:
  enabled: true
  algorithm: "ekf"  # "ekf" or "simple"
  max_time_diff_ms: 100
  angle_match_threshold_deg: 5.0
  distance_match_threshold_m: 0.5
  process_noise: 0.05
  max_association_distance: 2.0

# 规则引擎配置
rules:
  enabled: true
  rules_file: null  # Optional external YAML rules file
  default_rules:
    - rule_id: cross_line
      condition: "person_state == 'cross_line'"
      action: alarm_red
      priority: 10
      cooldown_seconds: 5
    - rule_id: climbing
      condition: "person_state == 'climbing'"
      action: alarm_red
      priority: 9
      cooldown_seconds: 3
    - rule_id: fallen
      condition: "person_state == 'fallen'"
      action: alarm_critical
      priority: 10
      cooldown_seconds: 1
    - rule_id: prolonged_stay
      condition: "person_state == 'prolonged_stay'"
      action: alarm_yellow
      priority: 5
      cooldown_seconds: 30

# 数据记录配置
recording:
  enabled: false
  output_dir: "recordings"
  auto_start: false

# 训练管线配置
training:
  enabled: false
  data_dir: "training_data"

# 模拟器配置
simulator:
  enabled: false
  num_persons: 2
  scene_bounds: [0.0, 0.0, 10.0, 6.0]
  sensor_types: ["camera", "lidar"]
  path_type: "random"
