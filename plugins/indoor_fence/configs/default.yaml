# =============================================================================
# 室内电子围栏插件 - 默认配置 (2.1)
# =============================================================================

# 区域配置文件
zone_config:
  path: "standalone/configs/zone.yaml"
  persist_on_update: true

# 模型配置
model:
  path: "models/indoor/person_yolov8n.onnx"
  device: "cpu"
  input_size: [640, 640]

# 推理配置
inference:
  confidence_threshold: 0.5
  nms_threshold: 0.45
  tracking_enabled: true
  max_track_age: 30

# 跟踪配置
tracking:
  enabled: true
  max_age: 30
  min_hits: 3
  distance_threshold: 1.0
  use_kalman: true

# 激光雷达配置
lidar:
  enabled: true
  device_ip: "192.168.1.100"
  device_port: 2368
  scan_rate_hz: 10
  angle_min_deg: -45
  angle_max_deg: 45
  angle_offset_deg: 0.0
  install:
    height_m: 2.5
    tilt_deg: 20
    scan_plane_height_m: 0.5

# 相机配置
camera:
  enabled: true
  source: "0"
  resolution: [640, 480]
  fps: 30
  confidence_threshold: 0.5
  nms_threshold: 0.45
  model_path: "models/indoor/person_yolov8n.onnx"
  cx: 320
  cy: 240
  fx: 500
  fy: 500
  height_m: 3.0
  tilt_deg: 40

# 视觉-雷达融合配置
fusion:
  enabled: true
  max_time_diff_ms: 100
  angle_match_threshold_deg: 5.0
  distance_match_threshold_m: 0.5

# 安全区域配置
safety_zone:
  yellow_line_distance_m: 0.5
  warning_distance_m: 0.3
  danger_distance_m: 0.1
  yellow_line_position_m: 2.0

# 授权与同柜多人策略
cabinet_authorization:
  enabled: true
  allow_list: [3, 4, 5]
  check_multi_person: true
  max_persons_per_cabinet: 1

# 灯光输出
light:
  enabled: true
  output_type: "simulate"

# 审计日志
audit:
  enabled: true
  log_level: "event"
  log_dir: "logs/indoor_fence"
