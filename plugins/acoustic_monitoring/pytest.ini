[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
filterwarnings =
    ignore:urllib3 v2 only supports OpenSSL.*
    ignore:urllib3 v2 only supports OpenSSL.*:urllib3.exceptions.NotOpenSSLWarning
    error::DeprecationWarning:plugins\.acoustic_monitoring
    error::PendingDeprecationWarning:plugins\.acoustic_monitoring
