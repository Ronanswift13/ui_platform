# 室内动物入侵检测 - 数据集配置
# ===================================
# 
# 使用 YOLO 格式标注 (class_id cx cy w h)
# 坐标归一化到 [0, 1]
#
# 目录结构:
#   data/
#   ├── images/
#   │   ├── train/    (训练集图片)
#   │   ├── val/      (验证集图片)
#   │   └── test/     (测试集图片)
#   └── labels/
#       ├── train/    (训练集标签)
#       ├── val/      (验证集标签)
#       └── test/     (测试集标签)

# 数据集路径 (相对于本文件的路径)
path: ../data
train: images/train
val: images/val
test: images/test

# 类别数
nc: 8

# 类别名称 (index 对应 AnimalClass)
names:
  0: mouse       # 鼠
  1: cat         # 猫
  2: snake       # 蛇
  3: bird        # 鸟
  4: dog         # 狗
  5: poultry     # 家禽
  6: insect      # 昆虫
  7: other       # 其他动物

# 数据采集与标注规范:
# - 每类最少 500 张 (推荐 1000+)
# - 覆盖不同光照条件 (日间/夜间/弱光)
# - 覆盖不同遮挡程度 (0% / 30% / 50%+)
# - 覆盖不同距离 (近景 <2m / 中景 2-5m / 远景 >5m)
# - 包含负样本 (无动物的背景图)
# - 标注工具推荐: LabelImg / CVAT / Roboflow
# - 数据增强: 由训练脚本自动执行 (Mosaic/MixUp/CopyPaste)
