# 室内动物入侵检测插件默认配置
# 对齐工程要求: 默认非仿真、真实推理优先

model:
  path: "models/animal/animal_yolov8n.onnx"
  device: "cpu"
  input_size: [640, 640]

# 依据《性能指标参数汇总》入侵检测约束
inference:
  confidence_threshold: 0.55
  nms_threshold: 0.4
  max_detections: 100
  multi_scale: true

thermal:
  enabled: false
  heat_diff_threshold_c: 2.0
  background_update_rate: 0.01

tracking:
  enabled: true
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3

deterrent:
  enabled: false
  stay_time_threshold_s: 2.0
  cooldown_s: 60.0
  audio_enabled: true
  light_enabled: true

statistics:
  report_interval_hours: 24
  history_retention_days: 90

simulation:
  enabled: false

zones:
  - zone_id: "zone_cable_trench"
    zone_name: "电缆沟"
    polygon: [[0.0, 0.7], [1.0, 0.7], [1.0, 1.0], [0.0, 1.0]]
    sensitivity: "high"
  - zone_id: "zone_cabinet"
    zone_name: "开关柜区"
    polygon: [[0.0, 0.0], [0.5, 0.0], [0.5, 0.7], [0.0, 0.7]]
    sensitivity: "high"
  - zone_id: "zone_general"
    zone_name: "一般区域"
    polygon: [[0.5, 0.0], [1.0, 0.0], [1.0, 0.7], [0.5, 0.7]]
    sensitivity: "medium"

site_id: ""
log_dir: "plugins/animal_detection/logs"
evidence_dir: "plugins/animal_detection/evidence"
