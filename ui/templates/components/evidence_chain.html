<!--
证据链展示组件 V4.0
输变电监测平台 - 动作事件域证据链

功能:
- 证据时间线可视化 (SOE/遥信/保护/断路器/一次/二次/人工复核)
- 证据充分性状态横幅
- 人工复核待确认状态
- 根因结论未达门限状态
- 空/错误/数据不足三态
- 证据节点筛选
- 导出报告
-->

<style>
.evidence-chain-container {
    background: var(--panel-bg, #1a1a2e);
    border-radius: 8px;
    overflow: hidden;
}

.evidence-chain-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem;
    border-bottom: 1px solid var(--panel-border, #2d3748);
}

.evidence-chain-title {
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.evidence-chain-title i {
    color: var(--accent-primary, #00d4ff);
}

.evidence-filter {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
}

.evidence-filter-btn {
    padding: 0.35rem 0.75rem;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--panel-border, #2d3748);
    border-radius: 6px;
    color: #888;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
}

.evidence-filter-btn:hover {
    color: #fff;
    border-color: var(--accent-primary, #00d4ff);
}

.evidence-filter-btn.active {
    background: rgba(0, 212, 255, 0.2);
    border-color: var(--accent-primary, #00d4ff);
    color: var(--accent-primary, #00d4ff);
}

.evidence-chain-body {
    padding: 1rem;
    max-height: 600px;
    overflow-y: auto;
}

/* 证据时间线 */
.evidence-timeline {
    position: relative;
    padding-left: 2rem;
}

.evidence-timeline::before {
    content: '';
    position: absolute;
    left: 0.5rem;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(180deg, var(--accent-primary, #00d4ff) 0%, rgba(0, 212, 255, 0.2) 100%);
}

.evidence-item {
    position: relative;
    margin-bottom: 1.25rem;
}

.evidence-item::before {
    content: '';
    position: absolute;
    left: -1.65rem;
    top: 0.5rem;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent-primary, #00d4ff);
    border: 2px solid var(--panel-bg, #1a1a2e);
    z-index: 1;
}

/* 节点类型圆点颜色 */
.evidence-item.soe::before { background: #06b6d4; }
.evidence-item.signal_change::before { background: #3b82f6; }
.evidence-item.protection::before { background: #ef4444; }
.evidence-item.breaker::before { background: #f59e0b; }
.evidence-item.primary_evidence::before { background: #10b981; }
.evidence-item.secondary_health::before { background: #a78bfa; }
.evidence-item.manual_review::before { background: #ec4899; }
.evidence-item.manual_review.pending::before {
    background: #f59e0b;
    box-shadow: 0 0 6px rgba(245, 158, 11, 0.5);
    animation: pulse-dot 1.5s ease-in-out infinite;
}

@keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 4px rgba(245, 158, 11, 0.3); }
    50% { box-shadow: 0 0 8px rgba(245, 158, 11, 0.7); }
}

.evidence-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--panel-border, #2d3748);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    transition: all 0.2s;
}

.evidence-card:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: rgba(0, 212, 255, 0.3);
}

.evidence-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.5rem;
}

.evidence-type {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.evidence-type-icon {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    flex-shrink: 0;
}

/* 节点类型图标背景 */
.evidence-type-icon.soe { background: rgba(6, 182, 212, 0.2); color: #06b6d4; }
.evidence-type-icon.signal_change { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
.evidence-type-icon.protection { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
.evidence-type-icon.breaker { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
.evidence-type-icon.recloser { background: rgba(139, 92, 246, 0.2); color: #8b5cf6; }
.evidence-type-icon.control_loop { background: rgba(236, 72, 153, 0.2); color: #ec4899; }
.evidence-type-icon.mechanism { background: rgba(251, 146, 60, 0.2); color: #fb923c; }
.evidence-type-icon.primary_evidence { background: rgba(16, 185, 129, 0.2); color: #10b981; }
.evidence-type-icon.secondary_health { background: rgba(167, 139, 250, 0.2); color: #a78bfa; }
.evidence-type-icon.manual_review { background: rgba(236, 72, 153, 0.2); color: #ec4899; }

.evidence-type-name {
    color: #fff;
    font-size: 0.85rem;
    font-weight: 500;
}

.evidence-source {
    color: #666;
    font-size: 0.7rem;
}

.evidence-time {
    color: #666;
    font-size: 0.75rem;
    font-family: monospace;
    white-space: nowrap;
}

.evidence-card-body {
    color: #aaa;
    font-size: 0.82rem;
}

.evidence-detail-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.25rem;
}

.evidence-detail-label { color: #666; }
.evidence-detail-value { color: #fff; }

/* 置信度条 */
.confidence-bar {
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 0.5rem;
}

.confidence-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s;
}

.confidence-bar-fill.high { background: linear-gradient(90deg, #10b981, #34d399); }
.confidence-bar-fill.medium { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.confidence-bar-fill.low { background: linear-gradient(90deg, #ef4444, #f87171); }

/* 人工复核节点特殊样式 */
.evidence-card.manual-pending {
    background: rgba(245, 158, 11, 0.06);
    border: 1px solid rgba(245, 158, 11, 0.3);
}

.evidence-card.manual-confirmed {
    background: rgba(16, 185, 129, 0.06);
    border: 1px solid rgba(16, 185, 129, 0.3);
}

.evidence-card.manual-rejected {
    background: rgba(107, 114, 128, 0.06);
    border: 1px solid rgba(107, 114, 128, 0.3);
}

.review-status-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 500;
}

.review-status-tag.pending {
    background: rgba(245, 158, 11, 0.2);
    color: #f59e0b;
}

.review-status-tag.confirmed {
    background: rgba(16, 185, 129, 0.2);
    color: #10b981;
}

.review-status-tag.rejected {
    background: rgba(107, 114, 128, 0.2);
    color: #9ca3af;
}

/* 状态横幅 */
.ec-status-banner {
    padding: 0.6rem 0.75rem;
    border-radius: 6px;
    font-size: 0.82rem;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.ec-status-banner.sufficient {
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.3);
    color: #34d399;
}

.ec-status-banner.partial {
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.3);
    color: #fbbf24;
}

.ec-status-banner.insufficient {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #f87171;
}

.ec-status-banner.below-threshold {
    background: rgba(139, 92, 246, 0.1);
    border: 1px solid rgba(139, 92, 246, 0.3);
    color: #a78bfa;
}

.ec-status-banner.pending-review {
    background: rgba(245, 158, 11, 0.1);
    border: 1px solid rgba(245, 158, 11, 0.3);
    color: #fbbf24;
}

.ec-status-banner.unknown {
    background: rgba(107, 114, 128, 0.1);
    border: 1px solid rgba(107, 114, 128, 0.3);
    color: #9ca3af;
}

/* 汇总 */
.evidence-summary {
    padding: 0.75rem 1rem;
    border-top: 1px solid var(--panel-border, #2d3748);
    background: rgba(0, 0, 0, 0.2);
}

.summary-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.75rem;
    margin-bottom: 0.5rem;
}

.summary-stat { text-align: center; }

.summary-stat-value {
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--accent-primary, #00d4ff);
}

.summary-stat-label {
    font-size: 0.7rem;
    color: #666;
}

/* 节点类型分布条 */
.node-type-distribution {
    margin-top: 0.75rem;
}

.node-type-distribution-title {
    color: #888;
    font-size: 0.75rem;
    margin-bottom: 0.5rem;
}

.node-type-bars {
    display: flex;
    height: 22px;
    border-radius: 4px;
    overflow: hidden;
}

.node-type-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    color: #fff;
    font-weight: 500;
    transition: width 0.5s;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
}

.node-type-bar.soe { background: #06b6d4; }
.node-type-bar.signal_change { background: #3b82f6; }
.node-type-bar.protection { background: #ef4444; }
.node-type-bar.breaker { background: #f59e0b; }
.node-type-bar.primary_evidence { background: #10b981; }
.node-type-bar.secondary_health { background: #a78bfa; }
.node-type-bar.manual_review { background: #ec4899; }

/* 导出按钮 */
.export-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.75rem;
    background: var(--accent-primary, #00d4ff);
    color: #000;
    border: none;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
}

.export-btn:hover { background: #33ddff; }

/* 空/错误/数据不足状态 */
.ec-empty-state {
    text-align: center;
    padding: 2.5rem 1rem;
    color: #555;
}

.ec-empty-state i {
    font-size: 2.5rem;
    margin-bottom: 0.75rem;
    display: block;
    opacity: 0.5;
}

.ec-empty-state p { font-size: 0.85rem; margin: 0.25rem 0; }
.ec-empty-state .sub { font-size: 0.78rem; color: #444; }

.ec-error-state {
    text-align: center;
    padding: 2rem 1rem;
    color: #f87171;
    background: rgba(239, 68, 68, 0.05);
    border: 1px solid rgba(239, 68, 68, 0.2);
    border-radius: 6px;
}

.ec-error-state i { font-size: 2rem; margin-bottom: 0.5rem; display: block; }
.ec-error-state .msg { font-size: 0.8rem; color: #aaa; margin-top: 0.3rem; }
</style>

<div class="evidence-chain-container" id="evidence-chain-container">
    <div class="evidence-chain-header">
        <div class="evidence-chain-title">
            <i class="bi bi-link-45deg"></i>
            <span>证据链</span>
            <span class="badge bg-primary" id="ec-count" style="font-size:0.7rem;">0</span>
        </div>
        <div class="evidence-filter">
            <button class="evidence-filter-btn active" data-filter="all" onclick="EvidenceChain.filter('all')">全部</button>
            <button class="evidence-filter-btn" data-filter="soe" onclick="EvidenceChain.filter('soe')">SOE</button>
            <button class="evidence-filter-btn" data-filter="signal_change" onclick="EvidenceChain.filter('signal_change')">遥信变位</button>
            <button class="evidence-filter-btn" data-filter="protection" onclick="EvidenceChain.filter('protection')">保护动作</button>
            <button class="evidence-filter-btn" data-filter="breaker" onclick="EvidenceChain.filter('breaker')">断路器</button>
            <button class="evidence-filter-btn" data-filter="primary_evidence" onclick="EvidenceChain.filter('primary_evidence')">一次设备</button>
            <button class="evidence-filter-btn" data-filter="secondary_health" onclick="EvidenceChain.filter('secondary_health')">二次健康</button>
            <button class="evidence-filter-btn" data-filter="manual_review" onclick="EvidenceChain.filter('manual_review')">人工复核</button>
        </div>
    </div>

    <div class="evidence-chain-body" id="ec-body">
        <!-- 状态横幅区(动态) -->
        <div id="ec-banners"></div>

        <!-- 证据时间线 -->
        <div class="evidence-timeline" id="ec-timeline"></div>

        <!-- 空状态 -->
        <div class="ec-empty-state" id="ec-empty">
            <i class="bi bi-diagram-3"></i>
            <p>暂无证据记录</p>
            <p class="sub">分析完成后，证据链将展示在此处</p>
        </div>

        <!-- 错误状态 -->
        <div class="ec-error-state" id="ec-error" style="display:none;">
            <i class="bi bi-exclamation-triangle"></i>
            <p>证据链加载失败</p>
            <div class="msg" id="ec-error-msg"></div>
        </div>
    </div>

    <div class="evidence-summary" id="ec-summary" style="display:none;">
        <div class="summary-stats">
            <div class="summary-stat">
                <div class="summary-stat-value" id="ec-stat-total">0</div>
                <div class="summary-stat-label">证据节点</div>
            </div>
            <div class="summary-stat">
                <div class="summary-stat-value" id="ec-stat-confirmed">0</div>
                <div class="summary-stat-label">已确认</div>
            </div>
            <div class="summary-stat">
                <div class="summary-stat-value" id="ec-stat-pending">0</div>
                <div class="summary-stat-label">待复核</div>
            </div>
            <div class="summary-stat">
                <div class="summary-stat-value" id="ec-stat-confidence">-</div>
                <div class="summary-stat-label">综合置信度</div>
            </div>
        </div>

        <div class="node-type-distribution">
            <div class="node-type-distribution-title">证据类型分布</div>
            <div class="node-type-bars" id="ec-type-bars"></div>
        </div>

        <div class="mt-2 d-flex justify-content-between align-items-center">
            <span class="text-muted" style="font-size: 0.72rem;">
                <i class="bi bi-clock"></i> 更新: <span id="ec-last-update">-</span>
            </span>
            <button class="export-btn" onclick="EvidenceChain.export()">
                <i class="bi bi-download"></i> 导出
            </button>
        </div>
    </div>
</div>

<script>
/**
 * 证据链管理器 V4.0
 * 适配动作事件域: SOE / 遥信变位 / 保护动作 / 断路器动作 / 一次设备证据 / 二次健康证据 / 人工复核结论
 */
const EvidenceChain = (function() {
    let evidenceList = [];
    let currentFilter = 'all';
    let contextMeta = {};  // {evidence_sufficiency, confidence, has_pending_review, below_threshold}

    // 节点类型配置
    const NODE_CONFIG = {
        'soe':              { icon: 'bi-list-ol',             label: 'SOE',          color: '#06b6d4' },
        'signal_change':    { icon: 'bi-arrow-left-right',    label: '遥信变位',     color: '#3b82f6' },
        'protection':       { icon: 'bi-shield-exclamation',  label: '保护动作',     color: '#ef4444' },
        'breaker':          { icon: 'bi-toggles',             label: '断路器动作',   color: '#f59e0b' },
        'recloser':         { icon: 'bi-arrow-repeat',        label: '重合闸',       color: '#8b5cf6' },
        'control_loop':     { icon: 'bi-slash-circle',        label: '控制回路',     color: '#ec4899' },
        'mechanism':        { icon: 'bi-gear',                label: '操作机构',     color: '#fb923c' },
        'primary_evidence': { icon: 'bi-lightning-charge',    label: '一次设备证据', color: '#10b981' },
        'secondary_health': { icon: 'bi-heart-pulse',         label: '二次健康证据', color: '#a78bfa' },
        'manual_review':    { icon: 'bi-person-check',        label: '人工复核结论', color: '#ec4899' },
    };

    const SUFFICIENCY_MAP = {
        'sufficient':   { text: '证据充分',                     icon: 'bi-check-circle-fill',           cls: 'sufficient' },
        'partial':      { text: '证据部分缺失，建议补充后复核', icon: 'bi-exclamation-triangle-fill',   cls: 'partial' },
        'insufficient': { text: '证据严重不足，结论仅供参考',   icon: 'bi-x-circle-fill',               cls: 'insufficient' },
        'unknown':      { text: '证据充分性未评估',             icon: 'bi-question-circle-fill',         cls: 'unknown' },
    };

    // DOM
    const getEl = id => document.getElementById(id);

    /**
     * 设置证据链数据
     * @param {Array} chain - 证据节点数组 [{node_type, description, source, timestamp, confidence, data, review_status}]
     * @param {Object} meta - 上下文元信息 {evidence_sufficiency, confidence, has_pending_review, below_threshold}
     */
    function setData(chain, meta) {
        evidenceList = chain || [];
        contextMeta = meta || {};
        currentFilter = 'all';
        // 重置筛选按钮
        document.querySelectorAll('#evidence-chain-container .evidence-filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === 'all');
        });
        render();
    }

    /**
     * 显示错误
     */
    function showError(msg) {
        evidenceList = [];
        getEl('ec-timeline').innerHTML = '';
        getEl('ec-empty').style.display = 'none';
        getEl('ec-error').style.display = 'block';
        getEl('ec-error-msg').textContent = msg || '';
        getEl('ec-banners').innerHTML = '';
        getEl('ec-summary').style.display = 'none';
    }

    /**
     * 重置为空状态
     */
    function reset() {
        evidenceList = [];
        contextMeta = {};
        getEl('ec-timeline').innerHTML = '';
        getEl('ec-empty').style.display = 'block';
        getEl('ec-error').style.display = 'none';
        getEl('ec-banners').innerHTML = '';
        getEl('ec-summary').style.display = 'none';
        getEl('ec-count').textContent = '0';
    }

    /**
     * 筛选
     */
    function filter(type) {
        currentFilter = type;
        document.querySelectorAll('#evidence-chain-container .evidence-filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === type);
        });
        render();
    }

    /**
     * 渲染
     */
    function render() {
        const filtered = applyFilter(evidenceList, currentFilter);
        const timelineEl = getEl('ec-timeline');
        const emptyEl = getEl('ec-empty');
        const errorEl = getEl('ec-error');
        const summaryEl = getEl('ec-summary');

        errorEl.style.display = 'none';

        if (evidenceList.length === 0) {
            timelineEl.innerHTML = '';
            emptyEl.style.display = 'block';
            summaryEl.style.display = 'none';
            getEl('ec-banners').innerHTML = '';
            getEl('ec-count').textContent = '0';
            return;
        }

        emptyEl.style.display = 'none';
        summaryEl.style.display = 'block';

        // 状态横幅
        renderBanners();

        // 时间线节点
        if (filtered.length === 0) {
            timelineEl.innerHTML = '<div style="text-align:center;padding:1.5rem;color:#555;font-size:0.85rem;">当前筛选条件下无匹配节点</div>';
        } else {
            timelineEl.innerHTML = filtered.map(n => renderNode(n)).join('');
        }

        // 统计
        updateStats();
    }

    /**
     * 渲染状态横幅
     */
    function renderBanners() {
        const bannersEl = getEl('ec-banners');
        let html = '';

        // 证据充分性
        const suf = SUFFICIENCY_MAP[contextMeta.evidence_sufficiency] || SUFFICIENCY_MAP['unknown'];
        html += `<div class="ec-status-banner ${suf.cls}"><i class="bi ${suf.icon}"></i> ${suf.text}</div>`;

        // 根因结论未达门限
        if (contextMeta.below_threshold) {
            html += `<div class="ec-status-banner below-threshold"><i class="bi bi-speedometer"></i> 根因结论置信度未达判定门限，当前结果仅供参考，建议补充证据后重新分析</div>`;
        }

        // 人工复核待确认
        const pendingReviews = evidenceList.filter(n => n.node_type === 'manual_review' && n.review_status === 'pending');
        if (pendingReviews.length > 0) {
            html += `<div class="ec-status-banner pending-review"><i class="bi bi-person-exclamation"></i> ${pendingReviews.length} 项人工复核待确认，请值班人员核实后确认结论</div>`;
        }

        bannersEl.innerHTML = html;
    }

    /**
     * 筛选
     */
    function applyFilter(list, f) {
        if (f === 'all') return list;
        return list.filter(n => n.node_type === f);
    }

    /**
     * 渲染单个证据节点
     */
    function renderNode(node) {
        const cfg = NODE_CONFIG[node.node_type] || { icon: 'bi-circle', label: node.node_type || '未知', color: '#666' };
        const conf = node.confidence != null ? node.confidence : null;
        const confPct = conf != null ? Math.round(conf * 100) : null;
        const confClass = conf >= 0.8 ? 'high' : conf >= 0.6 ? 'medium' : 'low';
        const ts = node.timestamp ? formatTimestamp(node.timestamp) : '';

        // 节点类型 class
        let itemClass = `evidence-item ${node.node_type}`;
        let cardClass = 'evidence-card';

        // 人工复核特殊处理
        if (node.node_type === 'manual_review') {
            const rs = node.review_status || 'pending';
            if (rs === 'pending') { itemClass += ' pending'; cardClass += ' manual-pending'; }
            else if (rs === 'confirmed') { cardClass += ' manual-confirmed'; }
            else { cardClass += ' manual-rejected'; }
        }

        // 详情行
        let details = '';
        if (node.description) {
            details += `<div class="evidence-detail-row"><span class="evidence-detail-label">描述</span><span class="evidence-detail-value">${escHtml(node.description)}</span></div>`;
        }
        if (node.source) {
            details += `<div class="evidence-detail-row"><span class="evidence-detail-label">来源</span><span class="evidence-detail-value">${escHtml(node.source)}</span></div>`;
        }
        if (node.data) {
            details += renderNodeData(node.node_type, node.data);
        }
        if (confPct != null) {
            const confColor = conf >= 0.8 ? '#10b981' : conf >= 0.6 ? '#f59e0b' : '#ef4444';
            details += `<div class="evidence-detail-row"><span class="evidence-detail-label">置信度</span><span class="evidence-detail-value" style="color:${confColor}">${confPct}%</span></div>`;
        }

        // 人工复核状态标签
        let reviewTag = '';
        if (node.node_type === 'manual_review') {
            const rs = node.review_status || 'pending';
            const tagMap = {
                'pending':   { cls: 'pending',   text: '待确认', icon: 'bi-hourglass-split' },
                'confirmed': { cls: 'confirmed', text: '已确认', icon: 'bi-check-circle' },
                'rejected':  { cls: 'rejected',  text: '已否决', icon: 'bi-x-circle' },
            };
            const tag = tagMap[rs] || tagMap['pending'];
            reviewTag = `<span class="review-status-tag ${tag.cls}"><i class="bi ${tag.icon}"></i> ${tag.text}</span>`;
        }

        return `
            <div class="${itemClass}" data-node-type="${node.node_type}">
                <div class="${cardClass}">
                    <div class="evidence-card-header">
                        <div class="evidence-type">
                            <div class="evidence-type-icon ${node.node_type}"><i class="bi ${cfg.icon}"></i></div>
                            <div>
                                <div class="evidence-type-name">${cfg.label} ${reviewTag}</div>
                            </div>
                        </div>
                        <div class="evidence-time">${ts}</div>
                    </div>
                    <div class="evidence-card-body">
                        ${details}
                        ${confPct != null ? `<div class="confidence-bar"><div class="confidence-bar-fill ${confClass}" style="width:${confPct}%"></div></div>` : ''}
                    </div>
                </div>
            </div>`;
    }

    /**
     * 渲染节点类型特定数据
     */
    function renderNodeData(nodeType, data) {
        if (!data) return '';
        let html = '';
        const row = (label, val) => val != null && val !== '' ? `<div class="evidence-detail-row"><span class="evidence-detail-label">${label}</span><span class="evidence-detail-value">${escHtml(String(val))}</span></div>` : '';

        switch(nodeType) {
            case 'soe':
                html += row('事件序号', data.seq_no);
                html += row('信号名称', data.signal_name);
                html += row('设备', data.device_name || data.device_id);
                break;
            case 'signal_change':
                html += row('信号名称', data.signal_name);
                html += row('变位前', data.value_before);
                html += row('变位后', data.value_after);
                html += row('间隔', data.bay_name || data.bay_id);
                break;
            case 'protection':
                html += row('保护类型', data.protection_type);
                html += row('装置', data.device_name || data.device_id);
                html += row('动作时间', data.action_time);
                break;
            case 'breaker':
                html += row('断路器', data.device_name || data.device_id);
                html += row('动作类型', data.action === 'open' ? '分闸' : data.action === 'close' ? '合闸' : data.action);
                html += row('间隔', data.bay_name || data.bay_id);
                break;
            case 'primary_evidence':
                html += row('设备', data.device_name || data.device_id);
                html += row('缺陷类型', data.defect_type);
                html += row('巡视来源', data.inspection_source);
                break;
            case 'secondary_health':
                html += row('装置', data.device_name || data.device_id);
                html += row('健康状态', data.health_status);
                html += row('最近校验', data.last_check);
                break;
            case 'manual_review':
                html += row('复核人', data.reviewer);
                html += row('复核时间', data.review_time);
                html += row('复核结论', data.conclusion);
                break;
            default:
                // 通用: 展示 signal_group, bay_id 等常见字段
                html += row('间隔', data.bay_name || data.bay_id);
                html += row('信号组', data.signal_group);
                break;
        }
        return html;
    }

    /**
     * 更新统计
     */
    function updateStats() {
        const total = evidenceList.length;
        const confirmed = evidenceList.filter(n => n.node_type === 'manual_review' && n.review_status === 'confirmed').length;
        const pending = evidenceList.filter(n => n.node_type === 'manual_review' && n.review_status === 'pending').length;

        const confs = evidenceList.filter(n => n.confidence != null).map(n => n.confidence);
        const avgConf = confs.length > 0 ? confs.reduce((a, b) => a + b, 0) / confs.length : null;

        getEl('ec-stat-total').textContent = total;
        getEl('ec-stat-confirmed').textContent = confirmed;
        getEl('ec-stat-pending').textContent = pending;
        getEl('ec-stat-confidence').textContent = avgConf != null ? Math.round(avgConf * 100) + '%' : '-';
        getEl('ec-count').textContent = total;
        getEl('ec-last-update').textContent = formatTimestamp(new Date().toISOString());

        // 类型分布条
        updateTypeDistribution();
    }

    /**
     * 节点类型分布条
     */
    function updateTypeDistribution() {
        const counts = {};
        evidenceList.forEach(n => { counts[n.node_type] = (counts[n.node_type] || 0) + 1; });
        const total = evidenceList.length || 1;

        const barsEl = getEl('ec-type-bars');
        const types = ['soe', 'signal_change', 'protection', 'breaker', 'primary_evidence', 'secondary_health', 'manual_review'];
        barsEl.innerHTML = types.map(t => {
            const c = counts[t] || 0;
            if (c === 0) return '';
            const pct = Math.round((c / total) * 100);
            const cfg = NODE_CONFIG[t] || {};
            return `<div class="node-type-bar ${t}" style="width:${pct}%">${pct > 12 ? cfg.label : ''}</div>`;
        }).join('');
    }

    /**
     * 格式化时间戳(保留毫秒)
     */
    function formatTimestamp(ts) {
        if (!ts) return '-';
        try {
            const d = new Date(ts);
            if (isNaN(d.getTime())) return ts;
            const p2 = n => String(n).padStart(2, '0');
            const p3 = n => String(n).padStart(3, '0');
            return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}.${p3(d.getMilliseconds())}`;
        } catch(e) { return ts; }
    }

    function escHtml(s) {
        if (!s) return '';
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    /**
     * 导出报告
     */
    function exportReport() {
        const report = {
            title: '动作事件证据链报告',
            generated: new Date().toISOString(),
            meta: contextMeta,
            summary: {
                totalNodes: evidenceList.length,
                confirmedReviews: evidenceList.filter(n => n.node_type === 'manual_review' && n.review_status === 'confirmed').length,
                pendingReviews: evidenceList.filter(n => n.node_type === 'manual_review' && n.review_status === 'pending').length,
            },
            evidenceChain: evidenceList.map(n => ({
                node_type: n.node_type,
                description: n.description,
                source: n.source,
                timestamp: n.timestamp,
                confidence: n.confidence,
                review_status: n.review_status,
                data: n.data,
            }))
        };

        const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `evidence_chain_${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    return {
        setData,
        showError,
        reset,
        filter,
        export: exportReport,
        getEvidence: () => evidenceList,
    };
})();
</script>
