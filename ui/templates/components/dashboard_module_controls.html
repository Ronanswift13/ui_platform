<!--
Dashboard 模块功能控制面板
输变电激光星芒破夜绘明监测平台 V3.0

根据当前选中的模块动态显示对应的功能设置
-->

<!-- 主变巡视功能面板 -->
<div class="module-control-panel" id="panel-transformer" style="display: none;">
    <div class="control-section">
        <h6 class="section-title"><i class="bi bi-exclamation-triangle text-danger"></i> 缺陷检测</h6>

        <!-- 油泄漏检测 -->
        <div class="control-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="transformer-oil-leak" checked>
                <label class="form-check-label" for="transformer-oil-leak">
                    <span class="badge bg-danger">油泄漏</span> 灰度/语义分割
                </label>
            </div>
            <div class="control-params">
                <div class="param-row">
                    <label>灰度阈值</label>
                    <input type="number" class="form-control form-control-sm" value="60" min="0" max="255">
                </div>
                <div class="param-row">
                    <label>最小面积</label>
                    <input type="number" class="form-control form-control-sm" value="500" min="100">
                </div>
            </div>
        </div>

        <!-- 锈蚀检测 -->
        <div class="control-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="transformer-rust" checked>
                <label class="form-check-label" for="transformer-rust">
                    <span class="badge bg-warning text-dark">锈蚀</span> HSV颜色检测
                </label>
            </div>
            <div class="control-params">
                <div class="param-row">
                    <label>HSV-H范围</label>
                    <input type="text" class="form-control form-control-sm" value="0-20">
                </div>
            </div>
        </div>

        <!-- 破损检测 -->
        <div class="control-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="transformer-damage" checked>
                <label class="form-check-label" for="transformer-damage">
                    <span class="badge bg-danger">破损</span> 边缘密度分析
                </label>
            </div>
            <div class="control-params">
                <div class="param-row">
                    <label>Canny阈值</label>
                    <input type="text" class="form-control form-control-sm" value="50-150">
                </div>
                <div class="param-row">
                    <label>边缘密度</label>
                    <input type="number" class="form-control form-control-sm" value="0.15" step="0.01" min="0" max="1">
                </div>
            </div>
        </div>

        <!-- 异物检测 -->
        <div class="control-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="transformer-foreign" checked>
                <label class="form-check-label" for="transformer-foreign">
                    <span class="badge bg-warning text-dark">异物</span> 背景差分
                </label>
            </div>
            <div class="control-params">
                <div class="param-row">
                    <label>差分阈值</label>
                    <input type="number" class="form-control form-control-sm" value="25" min="5" max="100">
                </div>
            </div>
        </div>
    </div>

    <div class="control-section">
        <h6 class="section-title"><i class="bi bi-eye text-info"></i> 状态识别</h6>

        <div class="control-item">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="transformer-silica" checked>
                <label class="form-check-label" for="transformer-silica">硅胶罐变色识别</label>
            </div>
        </div>

        <div class="control-item">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="transformer-valve" checked>
                <label class="form-check-label" for="transformer-valve">阀门开合状态</label>
            </div>
        </div>

        <div class="control-item">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="transformer-oil-level" checked>
                <label class="form-check-label" for="transformer-oil-level">油位计读数</label>
            </div>
        </div>
    </div>

    <div class="control-section">
        <h6 class="section-title"><i class="bi bi-thermometer-high text-danger"></i> 热成像分析</h6>
        <div class="control-item">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="transformer-thermal">
                <label class="form-check-label" for="transformer-thermal">启用热成像分析</label>
            </div>
            <div class="control-params">
                <div class="param-row">
                    <label>温度阈值(°C)</label>
                    <input type="number" class="form-control form-control-sm" value="80" min="40" max="150">
                </div>
            </div>
        </div>
    </div>

    <div class="control-section">
        <h6 class="section-title"><i class="bi bi-cpu text-success"></i> 深度学习</h6>
        <div class="control-item">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="transformer-dl" checked>
                <label class="form-check-label" for="transformer-dl">启用深度学习检测</label>
            </div>
            <div class="control-params">
                <div class="param-row">
                    <label>置信度阈值</label>
                    <input type="number" class="form-control form-control-sm" value="0.50" step="0.05" min="0" max="1">
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 开关巡视功能面板 -->
<div class="module-control-panel" id="panel-switch" style="display: none;">
    <div class="control-section">
        <h6 class="section-title"><i class="bi bi-toggle-on text-success"></i> 开关状态检测</h6>

        <div class="control-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="switch-position" checked>
                <label class="form-check-label" for="switch-position">分合位状态识别</label>
            </div>
        </div>

        <div class="control-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="switch-indicator" checked>
                <label class="form-check-label" for="switch-indicator">指示灯状态识别</label>
            </div>
        </div>

        <div class="control-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="switch-angle" checked>
                <label class="form-check-label" for="switch-angle">刀闸角度测量</label>
            </div>
            <div class="control-params">
                <div class="param-row">
                    <label>角度阈值(°)</label>
                    <input type="number" class="form-control form-control-sm" value="5" min="1" max="15">
                </div>
            </div>
        </div>
    </div>

    <div class="control-section">
        <h6 class="section-title"><i class="bi bi-shield-check text-primary"></i> 逻辑校验</h6>
        <div class="control-item">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="switch-logic" checked>
                <label class="form-check-label" for="switch-logic">启用五防逻辑校验</label>
            </div>
        </div>
    </div>
</div>

<!-- 母线巡视功能面板 -->
<div class="module-control-panel" id="panel-busbar" style="display: none;">
    <div class="control-section">
        <h6 class="section-title"><i class="bi bi-diagram-3 text-warning"></i> 母线检测</h6>

        <div class="control-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="busbar-insulator" checked>
                <label class="form-check-label" for="busbar-insulator">绝缘子串检测</label>
            </div>
        </div>

        <div class="control-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="busbar-fitting" checked>
                <label class="form-check-label" for="busbar-fitting">金具检测</label>
            </div>
        </div>

        <div class="control-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="busbar-connector" checked>

            </div>
        </div>
    </div>

    <div class="control-section">
        <h6 class="section-title"><i class="bi bi-search"></i> 远距小目标</h6>
        <div class="control-item">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="busbar-small-target" checked>
                <label class="form-check-label" for="busbar-small-target">启用小目标增强</label>
            </div>
            <div class="control-params">
                <div class="param-row">
                    <label>最小检测尺寸(px)</label>
                    <input type="number" class="form-control form-control-sm" value="16" min="8" max="64">
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 电容器巡视功能面板 -->

        <div class="control-item">

<!-- 表计读数功能面板 -->
<div class="module-control-panel" id="panel-meter" style="display: none;">
    <div class="control-section">
        <h6 class="section-title"><i class="bi bi-speedometer2 text-danger"></i> 表计识别</h6>

        <div class="control-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="meter-analog" checked>

            </div>
            <div class="control-params">
                <div class="param-row">

        <div class="control-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="meter-digital" checked>

        <div class="control-item">

    </div>

    <div class="control-section">
        <h6 class="section-title"><i class="bi bi-sliders"></i> 读数参数</h6>
        <div class="control-item">
            <div class="control-params">
                <div class="param-row">
                    <label>任意角度支持</label>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="meter-angle" checked>
                    </div>
                </div>
                <div class="param-row">
                    <label>OCR增强</label>
                    <div class="form-check form-switch">

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 鸟类监控功能面板 -->
<div class="module-control-panel" id="panel-bird" style="display: none;">
    <div class="control-section">
        <h6 class="section-title"><i class="bi bi-eye text-primary"></i> 鸟类检测</h6>

        <div class="control-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="bird-detection" checked>

            </div>
            <div class="control-params">
                <div class="param-row">
                    <label>置信度阈值</label>
                    <input type="number" class="form-control form-control-sm" value="0.50" step="0.05" min="0" max="1">
                </div>
            </div>
        </div>

        <div class="control-item">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="bird-species" checked>
                <label class="form-check-label" for="bird-species">种类识别</label>
            </div>
        </div>

        <div class="control-item">
            <div class="form-check">

                    <input type="number" class="form-control form-control-sm" value="10" min="3" max="15">

                    <input type="number" class="form-control form-control-sm" value="5" min="1" max="10">
                </div>

        </div>
    </div>

    <div class="control-section">
        <h6 class="section-title"><i class="bi bi-speaker text-info"></i> 驱鸟设备</h6>
        <div class="control-item">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="bird-deterrent">
                <label class="form-check-label" for="bird-deterrent">启用自动驱鸟</label>
            </div>
            <div class="control-params">
                <div class="param-row">
                    <label>声学驱鸟</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="bird-acoustic" checked>
                    </div>
                </div>
                <div class="param-row">
                    <label>激光驱鸟</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="bird-laser">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
