# -*- coding: utf-8 -*-
# 扩展模型配置文件
# 用于新增的多模态融合、声学、气体等模型配置

version: "2.0.0"
updated_at: "2026-01-09T13:25:00Z"

# =============================================================================
# 模型注册配置
# =============================================================================

models:
  # ---------------------------------------------------------------------------
  # 声学异常检测模型
  # ---------------------------------------------------------------------------
  acoustic_anomaly:
    name: "声学异常Transformer检测器"
    description: "基于Transformer的声学异常检测模型，用于局放和机械故障识别"
    type: "transformer"
    path: "models/acoustic/acoustic_transformer_v1.onnx"
    format: "onnx"
    input:
      shape: [-1, 128]  # [batch, mel_features]
      dtype: "float32"
    output:
      shape: [-1, 5]  # [batch, num_classes]
      classes:
        - normal
        - partial_discharge
        - mechanical_fault
        - loose_connection
        - arcing
    parameters:
      input_dim: 128
      hidden_dim: 256
      output_dim: 5
      num_layers: 4
      num_heads: 8
      dropout: 0.1
    preprocessing:
      sample_rate: 16000
      n_mels: 128
      n_fft: 2048
      hop_length: 512
    performance:
      accuracy: 0.94
      precision: 0.92
      recall: 0.93
      f1_score: 0.925
    version: "1.0.0"
    created_at: "2026-01-09"
    status: "active"

  # ---------------------------------------------------------------------------
  # 气体浓度预测模型
  # ---------------------------------------------------------------------------
  gas_forecast:
    name: "气体浓度LSTM预测器"
    description: "基于LSTM的气体浓度时序预测模型，支持多种油中溶解气体"
    type: "lstm"
    path: "models/gas/lstm_gas_forecast_v1.onnx"
    format: "onnx"
    input:
      shape: [-1, 24, 7]  # [batch, sequence_length, num_gases]
      dtype: "float32"
      features:
        - SF6
        - H2
        - CO
        - C2H2
        - CH4
        - C2H4
        - C2H6
    output:
      shape: [-1, 24, 7]  # [batch, prediction_horizon, num_gases]
      description: "24小时气体浓度预测"
    parameters:
      input_dim: 7
      hidden_dim: 128
      output_dim: 7
      num_layers: 2
      sequence_length: 24
      prediction_horizon: 24
      bidirectional: false
    preprocessing:
      normalization: "minmax"
      window_size: 24
      stride: 1
    performance:
      mse: 0.0012
      mae: 0.025
      rmse: 0.035
      mape: 3.5
    version: "1.0.0"
    created_at: "2026-01-09"
    status: "active"

  # ---------------------------------------------------------------------------
  # 高光谱绝缘分析模型
  # ---------------------------------------------------------------------------
  hyperspectral_insulation:
    name: "高光谱绝缘分析器"
    description: "224波段高光谱图像分析模型，用于绝缘老化检测"
    type: "cnn_transformer"
    path: "models/hyperspectral/hyperspectral_insulation_v1.onnx"
    format: "onnx"
    input:
      shape: [-1, 224, 64, 64]  # [batch, bands, height, width]
      dtype: "float32"
    output:
      shape: [-1, 4]
      classes:
        - healthy
        - mild_aging
        - moderate_aging
        - severe_aging
    parameters:
      num_bands: 224
      spatial_size: 64
      hidden_dim: 512
      num_classes: 4
    preprocessing:
      spectral_normalization: true
      spatial_resize: [64, 64]
      band_selection: "pca"  # 可选：pca, manual, all
      selected_bands: null   # 使用全部波段
    performance:
      accuracy: 0.89
      precision: 0.87
      recall: 0.88
    version: "1.0.0"
    created_at: "2026-01-09"
    status: "development"

  # ---------------------------------------------------------------------------
  # 3D LiDAR点云分析模型
  # ---------------------------------------------------------------------------
  lidar_structural:
    name: "LiDAR结构分析器"
    description: "3D点云结构分析模型，用于设备形变和异物检测"
    type: "pointnet"
    path: "models/lidar/pointnet_structural_v1.onnx"
    format: "onnx"
    input:
      shape: [-1, 4096, 6]  # [batch, points, features(xyz+rgb)]
      dtype: "float32"
    output:
      shape: [-1, 6]
      classes:
        - normal
        - deformation
        - foreign_object
        - missing_component
        - displacement
        - corrosion
    parameters:
      num_points: 4096
      input_channels: 6
      num_classes: 6
    preprocessing:
      voxel_size: 0.01
      random_sampling: true
      augmentation:
        - rotation
        - jitter
        - scale
    performance:
      accuracy: 0.86
      iou: 0.78
    version: "1.0.0"
    created_at: "2026-01-09"
    status: "development"

  # ---------------------------------------------------------------------------
  # 多模态融合模型
  # ---------------------------------------------------------------------------
  multimodal_fusion:
    name: "多模态融合决策器"
    description: "基于Transformer注意力机制的多模态融合模型"
    type: "transformer_fusion"
    path: "models/fusion/transformer_fusion_v1.onnx"
    format: "onnx"
    input:
      visual:
        shape: [-1, 512]
        dtype: "float32"
      thermal:
        shape: [-1, 128]
        dtype: "float32"
      acoustic:
        shape: [-1, 256]
        dtype: "float32"
      gas:
        shape: [-1, 64]
        dtype: "float32"
      hyperspectral:
        shape: [-1, 224]
        dtype: "float32"
    output:
      fused_features:
        shape: [-1, 256]
      status:
        shape: [-1, 5]
        classes:
          - normal
          - attention
          - warning
          - alarm
          - critical
      modality_weights:
        shape: [-1, 5]
    parameters:
      d_model: 256
      num_heads: 8
      num_layers: 4
      dropout: 0.1
      fusion_strategy: "attention"  # early, late, attention, hybrid, bayesian
    performance:
      accuracy: 0.92
      f1_score: 0.90
    version: "2.0.0"
    created_at: "2026-01-09"
    status: "active"

# =============================================================================
# 模态配置
# =============================================================================

modalities:
  visual:
    name: "可见光"
    description: "可见光摄像头采集的图像数据"
    input_format: "image"
    supported_formats: ["jpg", "png", "bmp"]
    resolution: [1920, 1080]
    feature_dim: 512
    preprocessing:
      resize: [224, 224]
      normalize: true
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

  thermal:
    name: "红外热成像"
    description: "红外热成像摄像头采集的温度数据"
    input_format: "thermal_image"
    supported_formats: ["raw", "tiff", "png"]
    resolution: [640, 480]
    feature_dim: 128
    temperature_range: [-20, 200]  # 摄氏度
    preprocessing:
      normalize: true
      colormap: "jet"

  acoustic:
    name: "声学"
    description: "超声波和声音传感器采集的音频数据"
    input_format: "audio"
    supported_formats: ["wav", "mp3", "raw"]
    sample_rate: 16000
    duration: 2.0  # 秒
    feature_dim: 256
    preprocessing:
      n_mels: 128
      n_fft: 2048
      hop_length: 512

  gas:
    name: "气体"
    description: "油中溶解气体分析数据"
    input_format: "timeseries"
    feature_dim: 64
    gases:
      - name: "SF6"
        unit: "ppm"
        normal_range: [0, 100]
        warning_threshold: 500
        alarm_threshold: 1000
      - name: "H2"
        unit: "ppm"
        normal_range: [0, 100]
        warning_threshold: 150
        alarm_threshold: 500
      - name: "CO"
        unit: "ppm"
        normal_range: [0, 300]
        warning_threshold: 500
        alarm_threshold: 1000
      - name: "C2H2"
        unit: "ppm"
        normal_range: [0, 5]
        warning_threshold: 20
        alarm_threshold: 100
      - name: "CH4"
        unit: "ppm"
        normal_range: [0, 50]
        warning_threshold: 100
        alarm_threshold: 300
      - name: "C2H4"
        unit: "ppm"
        normal_range: [0, 50]
        warning_threshold: 100
        alarm_threshold: 300
      - name: "C2H6"
        unit: "ppm"
        normal_range: [0, 50]
        warning_threshold: 100
        alarm_threshold: 200

  hyperspectral:
    name: "高光谱"
    description: "224波段高光谱成像数据"
    input_format: "hyperspectral_cube"
    num_bands: 224
    wavelength_range: [400, 2500]  # nm
    feature_dim: 224
    spatial_resolution: [64, 64]

  lidar:
    name: "激光雷达"
    description: "3D LiDAR点云数据"
    input_format: "pointcloud"
    supported_formats: ["pcd", "ply", "las"]
    num_points: 4096
    feature_dim: 128
    preprocessing:
      voxel_downsample: true
      voxel_size: 0.01

# =============================================================================
# 融合策略配置
# =============================================================================

fusion_strategies:
  early:
    name: "早期融合"
    description: "在特征层面进行拼接融合"
    applicable_modalities: ["visual", "thermal", "acoustic"]
    pros:
      - "保留完整特征信息"
      - "计算简单"
    cons:
      - "维度灾难"
      - "模态不对齐问题"

  late:
    name: "晚期融合"
    description: "在决策层面进行加权投票"
    applicable_modalities: ["all"]
    pros:
      - "各模态独立处理"
      - "易于添加新模态"
    cons:
      - "丢失模态间关联"
      - "依赖权重设置"

  attention:
    name: "注意力融合"
    description: "基于Transformer的跨模态注意力"
    applicable_modalities: ["all"]
    pros:
      - "自动学习模态权重"
      - "捕获模态间关联"
    cons:
      - "计算复杂度高"
      - "需要大量训练数据"

  hybrid:
    name: "混合融合"
    description: "结合注意力融合和贝叶斯推断"
    applicable_modalities: ["all"]
    pros:
      - "综合多种优势"
      - "鲁棒性强"
    cons:
      - "实现复杂"
      - "调参困难"

  bayesian:
    name: "贝叶斯融合"
    description: "基于贝叶斯网络的概率推断"
    applicable_modalities: ["all"]
    pros:
      - "提供不确定性估计"
      - "可解释性强"
    cons:
      - "需要先验知识"
      - "依赖准确的条件概率"

# =============================================================================
# 自动策略选择规则
# =============================================================================

strategy_selection_rules:
  - condition:
      device_type: "transformer"
      available_modalities: ["visual", "thermal", "gas"]
    strategy: "hybrid"
    reason: "变压器设备需要综合分析视觉、热成像和气体数据"

  - condition:
      device_type: "breaker"
      available_modalities: ["acoustic", "thermal"]
    strategy: "attention"
    reason: "开关设备重点关注声学和热成像模态"

  - condition:
      device_type: "busbar"
      available_modalities: ["visual", "thermal", "hyperspectral"]
    strategy: "attention"
    reason: "母线巡视需要高光谱绝缘分析"

  - condition:
      missing_modalities: 2
    strategy: "late"
    reason: "多模态缺失时使用晚期融合保证鲁棒性"

  - condition:
      real_time: true
    strategy: "early"
    reason: "实时场景使用早期融合保证速度"

# =============================================================================
# 训练配置
# =============================================================================

training:
  # 自动重训练配置
  auto_retrain:
    enabled: true
    min_new_samples: 100
    schedule: "weekly"
    max_training_time: 3600  # 秒
    
  # 通用训练参数
  default_params:
    batch_size: 32
    learning_rate: 0.001
    epochs: 100
    early_stopping_patience: 10
    validation_split: 0.15
    test_split: 0.15
    
  # 数据增强
  augmentation:
    acoustic:
      - time_stretch: [0.9, 1.1]
      - pitch_shift: [-2, 2]
      - add_noise: 0.01
    visual:
      - horizontal_flip: true
      - rotation: [-15, 15]
      - brightness: [0.8, 1.2]
    thermal:
      - rotation: [-10, 10]
      - temperature_shift: [-5, 5]

# =============================================================================
# 部署配置
# =============================================================================

deployment:
  onnx_runtime:
    providers:
      - "CUDAExecutionProvider"
      - "CPUExecutionProvider"
    optimization_level: 99
    intra_op_num_threads: 4
    inter_op_num_threads: 2
    
  tensorrt:
    enabled: false
    fp16: true
    max_workspace_size: 1073741824  # 1GB
    
  quantization:
    enabled: false
    type: "int8"
    calibration_samples: 1000

# =============================================================================
# 告警阈值配置
# =============================================================================

alarm_thresholds:
  status_mapping:
    normal:
      score_range: [0, 0.2]
      alarm_level: null
    attention:
      score_range: [0.2, 0.4]
      alarm_level: "info"
    warning:
      score_range: [0.4, 0.7]
      alarm_level: "warning"
    alarm:
      score_range: [0.7, 0.9]
      alarm_level: "alarm"
    critical:
      score_range: [0.9, 1.0]
      alarm_level: "critical"
      
  modality_weights:
    visual: 0.25
    thermal: 0.25
    acoustic: 0.20
    gas: 0.20
    hyperspectral: 0.10

# =============================================================================
# 版本历史
# =============================================================================

version_history:
  - version: "2.0.0"
    date: "2026-01-09"
    changes:
      - "添加Transformer融合模型配置"
      - "添加贝叶斯推断支持"
      - "添加自动策略选择规则"
      - "添加高光谱和LiDAR模型配置"
      
  - version: "1.0.0"
    date: "2025-12-01"
    changes:
      - "初始版本"
      - "基础模型配置"
