# 主变压器巡检 - 训练配置模板
plugin_id: transformer_inspection
legacy_alias: transformer
display_name: 主变压器巡检

model:
  family: yolov8
  backbone: yolov8s  # 变压器缺陷种类多，使用 small 模型
  pretrained: yolov8s.pt
  input_modality: rgb
  image_size: 640

task:
  primary: detection
  secondary: classification
  label_schema: detection_bbox
  classes:
    oil_system:
      - oil_leak
      - oil_level_normal
      - oil_level_low
    surface:
      - rust_none
      - rust_light
      - rust_heavy
    bushing:
      - bushing_normal
      - bushing_cracked
      - bushing_contaminated
    silica_gel:
      - silica_blue
      - silica_pink
      - silica_white
    thermal:
      - thermal_normal
      - thermal_warning
      - thermal_alarm

training:
  epochs: 150
  batch_size: 16
  learning_rate: 0.001
  optimizer: AdamW
  scheduler: cosine
  warmup_epochs: 5

augmentation:
  mosaic: 1.0
  mixup: 0.15
  fliplr: 0.5
  scale: 0.5
  hsv_h: 0.02
  hsv_s: 0.8
  hsv_v: 0.5

evaluation:
  metrics: [mAP@0.5, mAP@0.5:0.95, recall, precision]
  qualification:
    mAP@0.5: 0.65
    recall: 0.70

export:
  formats: [onnx, tensorrt]

voltage_levels: [UHV_1000kV_AC, UHV_800kV_DC, EHV_500kV, EHV_330kV, HV_220kV, HV_110kV]
