# 电容器巡检 - 训练配置模板
plugin_id: capacitor_inspection
legacy_alias: capacitor
display_name: 电容器巡检

model:
  family: yolov8
  backbone: yolov8n
  pretrained: yolov8n.pt
  input_modality: rgb
  image_size: 640

task:
  primary: detection
  secondary: classification
  label_schema: detection_bbox
  classes:
    structural:
      - capacitor_normal
      - capacitor_tilted
      - capacitor_collapsed
      - capacitor_missing
    component:
      - fuse_normal
      - fuse_blown
      - connector_loose
    intrusion:
      - intrusion_person
      - intrusion_vehicle
      - intrusion_animal

training:
  epochs: 100
  batch_size: 16
  learning_rate: 0.001
  optimizer: AdamW
  scheduler: cosine
  warmup_epochs: 3

augmentation:
  mosaic: 1.0
  mixup: 0.1
  fliplr: 0.5
  scale: 0.5

evaluation:
  metrics: [mAP@0.5, mAP@0.5:0.95, recall, precision]
  qualification:
    mAP@0.5: 0.60
    recall: 0.65

export:
  formats: [onnx, tensorrt]

voltage_levels: [HV_220kV, HV_110kV, MV_35kV, LV_10kV]
